1,a:Math.abs(diff),t:Date.now(),d:first?'Opening balance':'Balance adjusted'});saveLocal();render();setError(tr('savedone'))},saveperson:d=>{const name=$('#pn').value.trim(),ph=$('#pph').value.trim(),nt=$('#pnt').value.trim();if(!name)return setError(tr('name_req'));if(ph&&!/^[+\d()\-\s]{7,20}$/.test(ph))return setError(tr('ph10'));if(d.id){Object.assign(pp(Number(d.id)),{name,ph,nt})}else add(Number(d.c),name,ph,nt);saveLocal();const p=d.id?pp(Number(d.id)):S.people[S.people.length-1];st.pop();st.push('person:'+p.id);render()},saveentry:d=>{const p=pp(Number(d.id)),amount=Number(String($('#am').value).replace(/,/g,'')),c=Number(d.c),sg=Number(d.s),tm=new Date($('#dt').value).getTime();if(!p)return setError(tr('choose'));if(!Number.isFinite(amount)||amount<=0)return setError(tr('bad_amt'));if(!Number.isFinite(tm))return setError(tr('bad_dt'));const cents=Math.round(amount*100);if(sg<0&&cents>bal(p.id)&&!confirm(tr('exceeds')+'. '+tr('adv_q')))return;S.entries.push({i:S.nx++,p:p.id,s:sg,a:cents,t:tm,d:$('#ds').value.trim()});saveLocal();st.pop();render()},deleteperson:d=>{const id=Number(d.id);if(bal(id)!==0)return alert('This person has a balance. Record/settle transactions before deleting.');if(!confirm('Delete this person and their transaction history?'))return;S.people=S.people.filter(p=>p.id!==id);S.entries=S.entries.filter(e=>e.p!==id);saveLocal();go('list:'+((pp(id)?.c)||1))},gnext:d=>{st[st.length-1]='guide:'+(Number(d.i)+1);render();window.scrollTo(0,0)},gprev:d=>{st[st.length-1]='guide:'+(Number(d.i)-1);render();window.scrollTo(0,0)},gdone:()=>{if(S.tip){S.tip=0;saveLocal()}home()},exportbk:doExport,restorebk:doRestore,copylog:()=>{const t=logText();if(window.AndroidBridge&&AndroidBridge.copyText){AndroidBridge.copyText(t);setError(tr('copied'))}else{const e=$('#lg');if(e){e.select();try{document.execCommand('copy');setError(tr('copied'))}catch(x){}}}},clearlog:()=>{try{localStorage.removeItem('udaar_log')}catch(e){}render()},resetlocal:()=>{if(!confirm('Clear this phone’s copy? If you are signed in, your data will be downloaded again from your account.'))return;const keep={lang:S.lang,dark:S.dark,shop:S.shop,owner:S.owner,auth:S.auth,uid:S.uid};S={...defaults(),...keep};S.dirty=0;cloudReady=false;persist();home();resumeSync()}};
    A.addEventListener('click',async e=>{const t=e.target;const mn=$('#mn');if(mn&&!t.closest('.mw'))mn.hidden=true;const g=t.closest('[data-go]');if(g){go(g.dataset.go);return}const a=t.closest('[data-act]');if(a&&ACT[a.dataset.act]){const res=ACT[a.dataset.act](a.dataset,a);if(res&&typeof res.then==='function')await res}});
    // On launch: restore the saved login. If there is no internet, open the local data and sync later.
    (async()=>{if(DEV_MODE){booting=false;return}try{await ensureSb();if(sb){const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session?.user){currentUser=data.session.user;S.auth=1;persist();await loadCloudOrAsk()}}}catch(e){console.warn('Supabase session restore:',e.message)}finally{booting=false;if(!st.length&&S.auth===1)st=['home'];if(S.auth===1)syncState=navigator.onLine?(S.dirty?'ing':'ok'):(S.dirty?'off':'offi');render();resumeSync()}})();
    window.addEventListener('online',()=>{if(S.auth===1)setSync(S.dirty?'ing':'ok');resumeSync()});
    window.addEventListener('offline',()=>setSync(S.dirty?'off':'offi'));
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeSync()});
    setInterval(()=>{if(S.auth===1&&(S.dirty||!cloudReady))resumeSync()},30000);
    render();
